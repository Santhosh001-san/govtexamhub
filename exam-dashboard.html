                                    exp: "Kavach is the automatic collision avoidance system designed by Research Designs and Standards Organisation (RDSO) in India."
                                }
                            ]
                        }
                    }
                }
            }
        }
    };

    let activeExam = "";
    let activeSubject = "";
    let activeTopic = "";

    function init() {
        const urlParams = new URLSearchParams(window.location.search);
        const examParam = urlParams.get('exam');
        const subjectParam = urlParams.get('subject');
        const topicParam = urlParams.get('topic');

        if (!examParam || !examData[examParam] || !subjectParam || !examData[examParam].subjects[subjectParam]) {
            // Redirect to home if params invalid
            window.location.href = "index.html";
            return;
        }

        activeExam = examParam;
        activeSubject = subjectParam;

        const examObj = examData[activeExam];
        const subjectObj = examObj.subjects[activeSubject];

        // Update nav and titles
        document.getElementById("dashboard-subtitle").innerText = examObj.title + " - " + subjectObj.title;
        document.title = subjectObj.title + " Dashboard - GovtExamHub";
        
        const navExam = document.getElementById("nav-exam");
        navExam.href = activeExam + ".html";
        navExam.className = "active";
        navExam.innerText = activeExam.toUpperCase() + " Exam";

        // Determine initial active topic
        const topicKeys = Object.keys(subjectObj.topics);
        if (topicParam && subjectObj.topics[topicParam]) {
            activeTopic = topicParam;
        } else if (topicKeys.length > 0) {
            activeTopic = topicKeys[0];
        }

        renderTopicList();
        loadTopic(activeTopic);
        updateProgress();
    }

    function renderTopicList() {
        const list = document.getElementById("topic-list");
        list.innerHTML = "";
        
        const subjectObj = examData[activeExam].subjects[activeSubject];
        
        Object.keys(subjectObj.topics).forEach(key => {
            const topic = subjectObj.topics[key];
            const storageKey = `progress_${activeExam}_${activeSubject}_${key}`;
            const isCompleted = localStorage.getItem(storageKey) === 'completed';
            
            const li = document.createElement("li");
            li.className = `topic-item ${key === activeTopic ? 'active' : ''} ${isCompleted ? 'completed' : ''}`;
            li.id = `item-${key}`;
            li.setAttribute("onclick", `selectTopic('${key}')`);
            
            li.innerHTML = `
                <span>${topic.title}</span>
                <span class="chk-complete"></span>
            `;
            list.appendChild(li);
        });
    }

    function selectTopic(key) {
        activeTopic = key;
        
        // Update active class in sidebar
        document.querySelectorAll(".topic-item").forEach(item => {
            item.classList.remove("active");
        });
        const element = document.getElementById(`item-${key}`);
        if (element) element.classList.add("active");
        
        // Push state to URL without reloading
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + `?exam=${activeExam}&subject=${activeSubject}&topic=${key}`;
        window.history.pushState({path: newUrl}, '', newUrl);

        loadTopic(key);
    }

    function loadTopic(key) {
        const subjectObj = examData[activeExam].subjects[activeSubject];
        const topic = subjectObj.topics[key];
        
        if (!topic) return;
        
        document.getElementById("topic-title").innerText = topic.title;
        
        // Populate Notes & Formula Box
        document.getElementById("topic-notes").innerHTML = `
            ${topic.notes}
            <div class="formula-box">
                <strong>Tips & Key Concept:</strong> ${topic.formula}
            </div>
        `;

        // Update Complete Button
        const storageKey = `progress_${activeExam}_${activeSubject}_${key}`;
        const isCompleted = localStorage.getItem(storageKey) === 'completed';
        const btn = document.getElementById("complete-btn");
        const btnText = document.getElementById("btn-text");
        if (isCompleted) {
            btn.classList.add("completed");
            btnText.innerText = "Completed";
        } else {
            btn.classList.remove("completed");
            btnText.innerText = "Mark as Completed";
        }

        // Load Quiz
        const quizContainer = document.getElementById("quiz-container");
        quizContainer.innerHTML = "";
        
        if (topic.quiz && topic.quiz.length > 0) {
            topic.quiz.forEach((qObj, index) => {
                const card = document.createElement("div");
                card.className = "quiz-card";
                
                let optionsHTML = "";
                qObj.options.forEach((opt, optIndex) => {
                    optionsHTML += `
                        <li class="quiz-option" onclick="checkAnswer(this, ${index}, ${optIndex}, ${qObj.ans})">${opt}</li>
                    `;
                });

                card.innerHTML = `
                    <div class="quiz-question">Q${index + 1}: ${qObj.q}</div>
                    <ul class="quiz-options">
                        ${optionsHTML}
                    </ul>
                    <button class="reveal-btn" onclick="toggleExplanation(${index})">Show Answer & Explanation</button>
                    <div class="explanation" id="exp-${index}">${qObj.exp}</div>
                `;
                quizContainer.appendChild(card);
            });
        } else {
            quizContainer.innerHTML = "<p>No practice questions available for this topic yet.</p>";
        }
    }

    function checkAnswer(element, questionIndex, selectedIndex, correctIndex) {
        const parent = element.parentElement;
        const options = parent.querySelectorAll(".quiz-option");
        
        // Disable multiple clicks
        options.forEach(opt => {
            opt.style.pointerEvents = "none";
        });

        if (selectedIndex === correctIndex) {
            element.classList.add("correct");
        } else {
            element.classList.add("wrong");
            options[correctIndex].classList.add("correct");
        }
        
        toggleExplanation(questionIndex, true);
    }

    function toggleExplanation(index, forceShow = false) {
        const expDiv = document.getElementById(`exp-${index}`);
        if (!expDiv) return;
        if (forceShow || expDiv.style.display === "none" || !expDiv.style.display) {
            expDiv.style.display = "block";
        } else {
            expDiv.style.display = "none";
        }
    }

    function toggleTopicComplete() {
        const key = activeTopic;
        const storageKey = `progress_${activeExam}_${activeSubject}_${key}`;
        const isCompleted = localStorage.getItem(storageKey) === 'completed';
        const sidebarItem = document.getElementById(`item-${key}`);
        const btn = document.getElementById("complete-btn");
        const btnText = document.getElementById("btn-text");

        if (isCompleted) {
            localStorage.removeItem(storageKey);
            if (sidebarItem) sidebarItem.classList.remove("completed");
            btn.classList.remove("completed");
            btnText.innerText = "Mark as Completed";
        } else {
            localStorage.setItem(storageKey, 'completed');
            if (sidebarItem) sidebarItem.classList.add("completed");
            btn.classList.add("completed");
            btnText.innerText = "Completed";
        }
        
        updateProgress();
    }

    function updateProgress() {
        const subjectObj = examData[activeExam].subjects[activeSubject];
        const keys = Object.keys(subjectObj.topics);
        const total = keys.length;
        if (total === 0) return;
        
        let completed = 0;
        keys.forEach(key => {
            const storageKey = `progress_${activeExam}_${activeSubject}_${key}`;
            if (localStorage.getItem(storageKey) === 'completed') {
                completed++;
            }
        });

        const percent = Math.round((completed / total) * 100);
        document.getElementById("progress-bar").style.width = percent + "%";
        document.getElementById("progress-text").innerText = percent + "%";
    }

    function filterTopics() {
        const input = document.getElementById("search-input").value.toLowerCase();
        const items = document.querySelectorAll(".topic-item");
        
        items.forEach(item => {
            const text = item.innerText.toLowerCase();
            if (text.includes(input)) {
                item.style.display = "flex";
            } else {
                item.style.display = "none";
            }
        });
    }

    window.onload = init;
</script>
</body>
</html>
