    // Load URL topic or default
    let activeTopic = "analogy";

    function init() {
        const urlParams = new URLSearchParams(window.location.search);
        const topicParam = urlParams.get('topic');
        if (topicParam && topicsData[topicParam]) {
            activeTopic = topicParam;
        }
        renderTopicList();
        loadTopic(activeTopic);
        updateProgress();
    }

    function renderTopicList() {
        const list = document.getElementById("topic-list");
        list.innerHTML = "";
        
        Object.keys(topicsData).forEach(key => {
            const topic = topicsData[key];
            const isCompleted = localStorage.getItem(`reasoning_${key}`) === 'completed';
            
            const li = document.createElement("li");
            li.className = `topic-item ${key === activeTopic ? 'active' : ''} ${isCompleted ? 'completed' : ''}`;
            li.id = `item-${key}`;
            li.setAttribute("onclick", `selectTopic('${key}')`);
            
            li.innerHTML = `
                <span>${topic.title}</span>
                <span class="chk-complete"></span>
            `;
            list.appendChild(li);
        });
    }

    function selectTopic(key) {
        activeTopic = key;
        
        // Update active class in sidebar
        document.querySelectorAll(".topic-item").forEach(item => {
            item.classList.remove("active");
        });
        document.getElementById(`item-${key}`).classList.add("active");
        
        // Push state to URL without reloading
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?topic=' + key;
        window.history.pushState({path: newUrl}, '', newUrl);

        loadTopic(key);
    }

    function loadTopic(key) {
        const topic = topicsData[key];
        document.getElementById("topic-title").innerText = topic.title;
        
        // Populate Notes & Formula Box
        document.getElementById("topic-notes").innerHTML = `
            ${topic.notes}
            <div class="formula-box">
                <strong>Tips & Key Concept:</strong> ${topic.formula}
            </div>
        `;

        // Update Complete Button
        const isCompleted = localStorage.getItem(`reasoning_${key}`) === 'completed';
        const btn = document.getElementById("complete-btn");
        const btnText = document.getElementById("btn-text");
        if (isCompleted) {
            btn.classList.add("completed");
            btnText.innerText = "Completed";
        } else {
            btn.classList.remove("completed");
            btnText.innerText = "Mark as Completed";
        }

        // Load Quiz
        const quizContainer = document.getElementById("quiz-container");
        quizContainer.innerHTML = "";
        
        topic.quiz.forEach((qObj, index) => {
            const card = document.createElement("div");
            card.className = "quiz-card";
            
            let optionsHTML = "";
            qObj.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li class="quiz-option" onclick="checkAnswer(this, ${index}, ${optIndex}, ${qObj.ans})">${opt}</li>
                `;
            });

            card.innerHTML = `
                <div class="quiz-question">Q${index + 1}: ${qObj.q}</div>
                <ul class="quiz-options">
                    ${optionsHTML}
                </ul>
                <button class="reveal-btn" onclick="toggleExplanation(${index})">Show Answer & Explanation</button>
                <div class="explanation" id="exp-${index}">${qObj.exp}</div>
            `;
            quizContainer.appendChild(card);
        });
    }

    function checkAnswer(element, questionIndex, selectedIndex, correctIndex) {
        const parent = element.parentElement;
        const options = parent.querySelectorAll(".quiz-option");
        
        // Disable multiple clicks
        options.forEach(opt => {
            opt.style.pointerEvents = "none";
        });

        if (selectedIndex === correctIndex) {
            element.classList.add("correct");
        } else {
            element.classList.add("wrong");
            options[correctIndex].classList.add("correct");
        }
        
        toggleExplanation(questionIndex, true);
    }

    function toggleExplanation(index, forceShow = false) {
        const expDiv = document.getElementById(`exp-${index}`);
        if (forceShow || expDiv.style.display === "none" || !expDiv.style.display) {
            expDiv.style.display = "block";
        } else {
            expDiv.style.display = "none";
        }
    }

    function toggleTopicComplete() {
        const key = activeTopic;
        const isCompleted = localStorage.getItem(`reasoning_${key}`) === 'completed';
        const sidebarItem = document.getElementById(`item-${key}`);
        const btn = document.getElementById("complete-btn");
        const btnText = document.getElementById("btn-text");

        if (isCompleted) {
            localStorage.removeItem(`reasoning_${key}`);
            sidebarItem.classList.remove("completed");
            btn.classList.remove("completed");
            btnText.innerText = "Mark as Completed";
        } else {
            localStorage.setItem(`reasoning_${key}`, 'completed');
            sidebarItem.classList.add("completed");
            btn.classList.add("completed");
            btnText.innerText = "Completed";
        }
        
        updateProgress();
    }

    function updateProgress() {
        const total = Object.keys(topicsData).length;
        let completed = 0;
        
        Object.keys(topicsData).forEach(key => {
            if (localStorage.getItem(`reasoning_${key}`) === 'completed') {
                completed++;
            }
        });

        const percent = Math.round((completed / total) * 100);
        document.getElementById("progress-bar").style.width = percent + "%";
        document.getElementById("progress-text").innerText = percent + "%";
    }

    function filterTopics() {
        const input = document.getElementById("search-input").value.toLowerCase();
        const items = document.querySelectorAll(".topic-item");
        
        items.forEach(item => {
            const text = item.innerText.toLowerCase();
            if (text.includes(input)) {
                item.style.display = "flex";
            } else {
                item.style.display = "none";
            }
        });
    }

    window.onload = init;
</script>
</body>
</html>
